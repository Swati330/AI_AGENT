<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent — Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1220;
    --bg-grid: rgba(255,255,255,0.035);
    --surface: #121B2B;
    --surface-2: #182338;
    --border: rgba(255,255,255,0.09);
    --ink: #EDF1F5;
    --muted: #8A9BAE;
    --accent: #E8A33D;
    --accent-glow: rgba(232,163,61,0.4);
    --done: #3ECF8E;
    --done-glow: rgba(62,207,142,0.35);
    --fail: #F2685A;
    --fail-glow: rgba(242,104,90,0.35);
    --display: 'Space Grotesk', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 780px; }

  .wordmark {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .wordmark h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.5px;
    margin: 0;
    color: var(--ink);
  }
  .wordmark h1 span { color: var(--accent); }
  .status { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.up { background: var(--done); box-shadow: 0 0 8px var(--done-glow); }
  .dot.down { background: var(--fail); box-shadow: 0 0 8px var(--fail-glow); }
  .tagline { color: var(--muted); font-size: 12px; margin-bottom: 22px; }

  .pipeline {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 14px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .pnode { display: flex; flex-direction: column; align-items: center; min-width: 78px; }
  .pnode .ring {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    transition: all 0.3s ease;
  }
  .pnode.active .ring { background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); border-color: var(--accent); }
  .pnode.done .ring { background: var(--done); box-shadow: 0 0 8px var(--done-glow); border-color: var(--done); }
  .pnode.fail .ring { background: var(--fail); box-shadow: 0 0 8px var(--fail-glow); border-color: var(--fail); }
  .pnode.skip .ring { opacity: 0.3; }
  .pnode label { font-size: 9.5px; color: var(--muted); margin-top: 7px; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
  .pnode.active label, .pnode.done label { color: var(--ink); }
  .pline { flex: 1; height: 1.5px; background: var(--border); min-width: 16px; margin: 0 -2px; position: relative; top: -10px; }

  .thread {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    min-height: 400px;
    max-height: 52vh;
    overflow-y: auto;
    padding: 18px;
    margin-bottom: 14px;
  }
  .thread::-webkit-scrollbar { width: 6px; }
  .thread::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg { margin-bottom: 16px; max-width: 86%; opacity: 0; animation: rise 0.28s ease forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { margin-left: auto; }
  .bubble {
    padding: 11px 14px;
    border-radius: 10px;
    font-family: var(--display);
    font-size: 14.5px;
    line-height: 1.55;
    font-weight: 500;
  }
  .msg.user .bubble { background: var(--surface-2); border: 1px solid var(--border); color: var(--ink); }
  .msg.agent .bubble { background: rgba(232,163,61,0.06); border: 1px solid rgba(232,163,61,0.25); }
  .msg.agent .bubble.fail { background: rgba(242,104,90,0.08); border-color: rgba(242,104,90,0.35); }

  .trace-strip { display: flex; gap: 4px; margin-top: 7px; cursor: pointer; }
  .chip {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 7px;
    border-radius: 5px;
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .chip.done { color: var(--done); border-color: rgba(62,207,142,0.3); }
  .chip.fail { color: var(--fail); border-color: rgba(242,104,90,0.3); }
  .chip.skip { opacity: 0.4; }
  .trace-detail {
    display: none;
    margin-top: 7px;
    padding: 9px 11px;
    background: var(--surface-2);
    border: 1px dashed var(--border);
    border-radius: 7px;
    font-size: 11px;
    color: var(--muted);
    white-space: pre;
  }
  .trace-detail.open { display: block; }

  .thinking { display: flex; gap: 5px; align-items: center; padding: 3px 2px; }
  .thinking span { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  @media (prefers-reduced-motion: no-preference) {
    .thinking span { animation: blip 1s ease-in-out infinite; }
    .thinking span:nth-child(2) { animation-delay: 0.15s; }
    .thinking span:nth-child(3) { animation-delay: 0.3s; }
  }
  @keyframes blip { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }

  .composer { display: flex; gap: 8px; }
  .composer input {
    flex: 1;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14.5px;
    font-family: var(--display);
    font-weight: 500;
    background: var(--surface);
    color: var(--ink);
  }
  .composer input::placeholder { color: var(--muted); }
  .composer input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .composer button {
    padding: 13px 22px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #1A1204;
    font-size: 14px;
    font-weight: 700;
    font-family: var(--display);
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .composer button:hover:not(:disabled) { filter: brightness(1.1); }
  .composer button:disabled { opacity: 0.4; cursor: not-allowed; }

  .hint { text-align: center; color: var(--muted); font-size: 10.5px; margin-top: 12px; }
</style>
</head>
<body>

<div class="app">
  <div class="wordmark">
    <h1>AI<span>_</span>AGENT</h1>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">checking backend…</span></div>
  </div>
  <div class="tagline">8-stage pipeline · zero agent frameworks · built from scratch</div>

  <div class="pipeline" id="pipeline"></div>

  <div class="thread" id="thread"></div>

  <div class="composer">
    <input type="text" id="queryInput" placeholder="Ask something — a calculation, weather, or a question" autofocus>
    <button id="sendBtn">Run</button>
  </div>
  <div class="hint">local backend · 127.0.0.1:8000 · start with: uvicorn api.main:app --reload</div>
</div>

<script>
const API_URL = "http://127.0.0.1:8000/query";
const HEALTH_URL = "http://127.0.0.1:8000/health";
const thread = document.getElementById('thread');
const input = document.getElementById('queryInput');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const pipelineEl = document.getElementById('pipeline');

const STAGES = [
  { key: 'intent', label: 'Intent' },
  { key: 'plan', label: 'Plan' },
  { key: 'tool', label: 'Tool' },
  { key: 'validate', label: 'Validate' },
  { key: 'respond', label: 'Respond' },
];

function renderPipeline(states) {
  pipelineEl.innerHTML = '';
  STAGES.forEach((s, i) => {
    const node = document.createElement('div');
    node.className = `pnode ${states[i] || ''}`;
    node.innerHTML = `<div class="ring"></div><label>${s.label}</label>`;
    pipelineEl.appendChild(node);
    if (i < STAGES.length - 1) {
      const line = document.createElement('div');
      line.className = 'pline';
      pipelineEl.appendChild(line);
    }
  });
}
renderPipeline(['', '', '', '', '']);

async function checkHealth() {
  try {
    const res = await fetch(HEALTH_URL);
    if (res.ok) { statusDot.classList.add('up'); statusText.textContent = "online"; }
    else throw new Error();
  } catch {
    statusDot.classList.add('down');
    statusText.textContent = "unreachable";
  }
}
checkHealth();

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
  return div;
}

function addThinking() {
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.id = 'thinkingMsg';
  div.innerHTML = `<div class="bubble"><div class="thinking"><span></span><span></span><span></span></div></div>`;
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
}
function removeThinking() { const el = document.getElementById('thinkingMsg'); if (el) el.remove(); }

let animTimer = null;
function animatePipelineWhileWaiting() {
  let step = 0;
  renderPipeline(['', '', '', '', '']);
  animTimer = setInterval(() => {
    const states = STAGES.map((_, i) => i < step ? 'done' : i === step ? 'active' : '');
    renderPipeline(states);
    step++;
    if (step > STAGES.length) clearInterval(animTimer);
  }, 380);
}

function finalizePipeline(response) {
  clearInterval(animTimer);
  const ranTool = response.tool_used && response.tool_used !== 'none';
  const states = STAGES.map(s => {
    if (s.key === 'tool' && !ranTool) return 'skip';
    if (!response.success && (s.key === 'validate' || s.key === 'respond')) return 'fail';
    return 'done';
  });
  renderPipeline(states);
}

function buildTrace(response) {
  const container = document.createElement('div');
  const strip = document.createElement('div');
  strip.className = 'trace-strip';
  const ranTool = response.tool_used && response.tool_used !== 'none';
  STAGES.forEach(s => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = s.label.toLowerCase();
    if (s.key === 'tool' && !ranTool) chip.classList.add('skip');
    else if (!response.success && (s.key === 'validate' || s.key === 'respond')) chip.classList.add('fail');
    else chip.classList.add('done');
    strip.appendChild(chip);
  });
  const detail = document.createElement('div');
  detail.className = 'trace-detail';
  detail.textContent =
`request_id    ${response.request_id}
intent_type   ${response.intent_type}
tool_used     ${response.tool_used}
used_fallback ${response.used_fallback}
success       ${response.success}`;
  strip.addEventListener('click', () => detail.classList.toggle('open'));
  container.appendChild(strip);
  container.appendChild(detail);
  return container;
}

async function sendQuery() {
  const query = input.value.trim();
  if (!query) return;
  addMessage('user', query);
  input.value = '';
  sendBtn.disabled = true;
  addThinking();
  animatePipelineWhileWaiting();

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });
    const data = await res.json();
    removeThinking();
    finalizePipeline(data);
    const msgDiv = addMessage('agent', data.answer);
    if (!data.success) msgDiv.querySelector('.bubble').classList.add('fail');
    msgDiv.appendChild(buildTrace(data));
  } catch (err) {
    removeThinking();
    clearInterval(animTimer);
    renderPipeline(['fail', '', '', '', '']);
    const msgDiv = addMessage('agent', "Couldn't reach the backend. Is uvicorn running on port 8000?");
    msgDiv.querySelector('.bubble').classList.add('fail');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', sendQuery);
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendQuery(); });
</script>

</body>
</html>
